[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "incident-analysis",
    "libpass[bcrypt]>=1.9.3",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "resend>=2.0.0",
    "shared",
    "sqlmodel>=0.0.47",
    "tinydb>=4.9.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
py-modules = ["seed"]

[tool.uv.sources]
incident-analysis = { path = "../../packages/incident_analysis", editable = true }
shared = { path = "../../packages/shared", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
