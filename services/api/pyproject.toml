[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "incident-analysis",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "tinydb>=4.9.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
py-modules = ["seed"]

[tool.uv.sources]
incident-analysis = { path = "../../packages/incident_analysis", editable = true }
